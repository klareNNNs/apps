<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Army Organizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .animate-fadeIn { animation: fadeIn 0.2s ease-out; }
    .glass { background: rgba(30, 30, 40, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    .faction-card { transition: transform 0.2s, box-shadow 0.2s; }
    .faction-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.4); }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-slate-900 to-gray-900 min-h-screen text-gray-100">

  <div class="max-w-4xl mx-auto p-4 md:p-6 flex flex-col items-center justify-center min-h-screen">

    <header class="text-center mb-12">
      <h1 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent mb-2">
        Army Organizer
      </h1>
      <p class="text-gray-400">Selecciona un sistema de juego</p>
      <a href="../index.html" class="inline-block mt-2 text-emerald-400 hover:text-emerald-300 text-sm">← Volver a Apps</a>
    </header>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full max-w-2xl">

      <a href="tow.html" class="faction-card glass rounded-2xl p-8 cursor-pointer bg-gradient-to-br from-red-700 to-red-950 text-center no-underline animate-fadeIn">
        <div class="text-6xl mb-4">⚔️</div>
        <h2 class="text-2xl font-bold text-white mb-2">The Old World</h2>
        <p class="text-white/60 text-sm">Warhammer: The Old World</p>
      </a>

      <a href="40k.html" class="faction-card glass rounded-2xl p-8 cursor-pointer bg-gradient-to-br from-blue-700 to-blue-950 text-center no-underline animate-fadeIn">
        <div class="text-6xl mb-4">🔫</div>
        <h2 class="text-2xl font-bold text-white mb-2">Warhammer 40,000</h2>
        <p class="text-white/60 text-sm">Warhammer 40K</p>
      </a>

    </div>

  </div>

</body>
</html>
